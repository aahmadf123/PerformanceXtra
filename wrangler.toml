name = "performance-xtra"
compatibility_date = "2026-06-27"

main = "worker.js"

[build]
command = "node build/copy-assets.mjs"

[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "performancextra"
database_id = "a1c23e94-460d-482d-8c2b-d1b93375d9ce"

# Set SESSION_SECRET in the Cloudflare Pages dashboard (Settings -> Environment variables),
# NOT here — secrets should not be committed.
